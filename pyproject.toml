[project]
name = "left4dead2"
version = "2.0.0"
description = "求生之路2 mod管理器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.17.2",
    "chardet>=5.2.0",
    "loguru>=0.7.3",
    "psutil>=7.1.0",
    "pydantic>=2.12.3",
    "pyqt-fluent-widgets>=1.10.4",
    "pyqt5==5.15.11",
    "pyqt5-qt5==5.15.2",
    "qfluentpackage",
    "qtawesome>=1.4.0",
    "requests>=2.32.5",
    "sqlmodel>=0.0.27",
    "vdf>=3.4",
]

[tool.uv.sources]
qfluentpackage = { url = "https://github.com/fdklgbh/my_qfluent_utils_package/releases/download/1.0.3/qfluentpackage-1.0.3-py3-none-any.whl" }

[dependency-groups]
dev = [
    "black>=25.12.0",
    "darglint>=1.8.1",
    "pre-commit>=4.5.1",
]

# ======== Black 配置 ========
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | \.idea
  | __pycache__
  | alembic
  | build
  | dist
  | temp
  | readme_pic
  | src/views/ui
  | src/utils/vpk/vpk_change\.py
)
'''

[tool.darglint]
ignore = ["DAR101", "DAR201", "DAR401"]
strictness = "short"
docstring_style = "google"
