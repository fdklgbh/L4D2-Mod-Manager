[project]
name = "left4dead2"
version = "2.0.0"
description = "求生之路2 mod管理器"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "alembic>=1.17.2",
    "chardet>=5.2.0",
    "loguru>=0.7.3",
    "psutil>=7.2.0",
    "pydantic>=2.12.3",
    "pyside6>=6.10.1",
    "pyside6-fluent-widgets>=1.10.5",
    "qfluentpackage",
    "qtawesome>=1.4.0",
    "requests>=2.32.5",
    "vdf>=3.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.1",
]

# ======== Ruff 配置 ========
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".idea",
    "alembic",
    "build",
    "dist",
    "temp",
    "readme_pic",
    "src/shared/vpk/vpk_change.py",
    "src/features/**/ui",
]

[tool.ruff.lint]
# F401 matches autoflake's --remove-all-unused-imports behavior.
# DOC rules preserve the darglint checks that were not ignored.
preview = true
select = ["F401", "DOC102", "DOC202", "DOC402", "DOC403", "DOC502"]

[tool.ruff.lint.per-file-ignores]
# Preserve autoflake's existing __init__.py exclusion.
"__init__.py" = ["F401"]

[tool.ruff.format]
# Keep Ruff's stable, Black-compatible formatting style.
preview = false

[tool.uv.sources]
qfluentpackage = { url = "https://github.com/fdklgbh/my_qfluent_utils_package/releases/download/1.0.4/qfluentpackage-1.0.4-py3-none-any.whl" }
