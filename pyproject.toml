[project]
name = "left4dead2"
version = "2.0.0"
description = "求生之路2 mod管理器"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "alembic>=1.17.2",
    "chardet>=5.2.0",
    "loguru>=0.7.3",
    "psutil>=7.2.0",
    "pydantic>=2.12.3",
    "pyside6>=6.10.1",
    "pyside6-fluent-widgets>=1.10.5",
    "qfluentpackage",
    "qtawesome>=1.4.0",
    "requests>=2.32.5",
    "vdf>=3.4",
]

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
    "black>=25.12.0",
    "darglint>=1.8.1",
    "pre-commit>=4.5.1",
]

# ======== Black 配置 ========
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | \.idea
  | __pycache__
  | alembic
  | build
  | dist
  | temp
  | readme_pic
  | src/utils/vpk/vpk_change\.py
  | src/views/ui
)
'''

[tool.darglint]
ignore = ["DAR101", "DAR201", "DAR401"]
strictness = "short"
docstring_style = "google"

[tool.uv.sources]
qfluentpackage = { url = "https://github.com/fdklgbh/my_qfluent_utils_package/releases/download/1.0.4/qfluentpackage-1.0.4-py3-none-any.whl" }
